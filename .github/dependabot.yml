version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: JsonSchema.Net
        update-types: ["version-update:semver-major"]
      - dependency-name: JsonPointer.Net
        update-types: ["version-update:semver-major"]
      - dependency-name: Json.More.Net
        update-types: ["version-update:semver-major"]
      - dependency-name: Verify.NUnit
        update-types: ["version-update:semver-major"]
      - dependency-name: Verify
        update-types: ["version-update:semver-major"]
      - dependency-name: NUnit
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
